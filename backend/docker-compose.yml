version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    volumes:
      - ./data:/app/data
      - ./memory:/app/memory

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  # Optional: Monitoring
  prometheus:
    image: prom/prometheus
    volumes:
      - ./deployment/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
